apiVersion: v1
kind: ConfigMap

metadata:
  name: alertmanager-config
  namespace: monitoring

data:
  config.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'ramremus007@gmail.com'
      smtp_auth_username: 'ramremus007@gmail.com'
      smtp_auth_password_file: /etc/alertmanager-secret/smtp-password
      smtp_require_tls: true

    route:
      receiver: email-notifications

    receivers:
      - name: email-notifications
        email_configs:
          - to: 'ramremus007@gmail.com'
