apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: prometheus
  namespace: monitoring

spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.retention.size=8GB"
          ports:
            - containerPort: 9090

          volumeMounts:
            - name: prometheus-storage
              mountPath: /prometheus

            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

          startupProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 70
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc