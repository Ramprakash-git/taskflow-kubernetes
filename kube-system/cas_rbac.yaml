apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - nodes/status
    verbs: ["patch", "update"]

  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: ["create"]

  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]

  - apiGroups: ["coordination.k8s.io"]
    resources: 
      - leases
    verbs: ["create"]

  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]

  - apiGroups: [""]
    resources:
      - persistentvolumes
      - persistentvolumeclaims
      - replicationcontrollers
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - csidrivers
      - csinodes
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]

  - apiGroups: ["resource.k8s.io"]
    resources:
      - resourceslices
      - resourceclaims
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - services
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources:
      - csistoragecapacities
    verbs: ["get", "list", "watch"]

  - apiGroups: ["resource.k8s.io"]
    resources:
      - deviceclasses
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler-configmap
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["create","list","watch"]

  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames: ["cluster-autoscaler-status"]
    verbs: ["get", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler-configmap
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
roleRef:
  kind: Role
  name: cluster-autoscaler-configmap
  apiGroup: rbac.authorization.k8s.io