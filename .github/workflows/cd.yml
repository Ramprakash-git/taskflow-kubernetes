name: k8s CD

concurrency:
  group: taskflow-eks-deployment
  cancel-in-progress: false
  
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: k8s
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_K8S }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update Kubectl context
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
      - name: Deploy to EKS
        run: |
          find ./k8s -type f -name '*.yaml' ! -name 'deployment.yaml' ! -name '*rbac*.yaml' -exec kubectl apply -f {} \;